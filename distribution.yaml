# task-ambi-harness 配布マニフェスト（F6 正本・フルパス版）
# スキーマ: hermes profile install の distribution.yaml
#   （hermes_cli/profile_distribution.py DistributionManifest に準拠）
# env_requires のキー一覧は harness/.env.EXAMPLE（F5 成果物）と一致させる。

name: task-ambi-harness
version: 0.1.0
description: task_ambi 4階層カンバン組織の Hermes ハーネス一式（SOUL・config・skills・agent-hooks・25役 SOUL・criteria・cron）。
license: MIT
env_requires:
  - name: HARNESS_HOME
    description: 導入先の Hermes ホーム（例 - /home/user/.hermes）
  - name: HARNESS_USER_HOME
    description: 導入先のユーザホーム（例 - /home/user）。ホーム配下パスの共通接頭辞
  - name: HARNESS_VAULT_ROOT
    description: Obsidian vault のルートパス（vault 参照系スキル・cron の復元用）
  - name: HARNESS_KANBAN_RUNS_DIR
    description: ワーク実行ルート（kanban ワーカの実行ディレクトリ）
  - name: HARNESS_PROJECT_ROOT
    description: ${REPO_NAME} ローカルリポジトリのパス
  - name: HARNESS_LANGFUSE_URL
    description: Langfuse の URL（self-host 環境のホスト名またはIP+ポート）
  - name: HARNESS_LANGFUSE_PUBLIC_KEY
    description: Langfuse の public key（プロジェクト設定で発行）
  - name: HARNESS_LANGFUSE_SECRET_KEY
    description: Langfuse の secret key（秘匿値のため取り扱い注意）
  - name: HARNESS_PROJECT_NAME_MAP
    description: プロジェクト一般名と実名の対応（criteria 一般化の復元用。カンマ区切りの一般名=実名ペア）
  - name: HARNESS_DASHBOARD_BASIC_AUTH_USERNAME
    description: ダッシュボード basic auth のユーザ名
  - name: HARNESS_DASHBOARD_BASIC_AUTH_PASSWORD_HASH
    description: ダッシュボード basic auth の scrypt パスワードハッシュ（秘匿値のため取り扱い注意）
  - name: HARNESS_DASHBOARD_BASIC_AUTH_SECRET
    description: ダッシュボード basic auth の secret トークン（秘匿値のため取り扱い注意）
