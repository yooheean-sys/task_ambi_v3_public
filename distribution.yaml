# task-ambi-harness 配布マニフェスト
# 完全な導入・部分設定反映・25役の更新は install_local.sh を使用する。
# hermes profile install 単体では独自の部分移行処理は実行されない。
name: task-ambi-harness
version: 0.2.0
description: task_ambi の SOUL・選択スキル・MCP・hooks・25役 SOUL・criteria・cron を配布。config.yaml 全体とプラグインは移行しない。
license: MIT
env_requires:
  - name: HARNESS_HOME
    description: 導入先の初期設定済み Hermes ホーム
  - name: HARNESS_USER_HOME
    description: 導入先のユーザホーム
  - name: HARNESS_VAULT_ROOT
    description: Obsidian vault のルートパス
  - name: HARNESS_KANBAN_RUNS_DIR
    description: criteria の配置先となるワーク実行ルート
  - name: HARNESS_PROJECT_ROOT
    description: ハーネスの正本リポジトリのパス
  - name: HARNESS_PROJECT_NAME_MAP
    description: 一般名と正式名の対応。専用 installer では直値キーによる指定も可能
